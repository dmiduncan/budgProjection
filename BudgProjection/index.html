<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1 maximum-scale=1">
    <title>Budget Projection</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        /* ── BudgProjection-specific styles ── */

        /* Balance input row */
        .balance-row {
            display: flex;
            align-items: flex-end;
            gap: 0.75em;
            margin-bottom: 2em;
            min-width: 0;
        }

        .balance-field {
            display: flex;
            flex-direction: column;
            gap: 0.3em;
            flex: 1;
            min-width: 0;
            max-width: 180px;
        }

        .balance-field input { text-align: right; width: 100%; min-width: 0; }

        #recalcButton { flex-shrink: 0; }

        /* Transactions list */
        #txBucket {
            margin-top: 0.5em;
        }

        #txBucket h3 {
            font-family: var(--font-display);
            font-size: 0.68em;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 0.75em;
            padding-bottom: 0.5em;
            border-bottom: 1px solid var(--border);
        }

        #txList {
            display: flex;
            flex-direction: column;
            gap: 0;
            list-style: none;
            padding: 0;
        }

        #txList {
            max-width: 480px;
        }

        .tx-row {
            display: grid;
            grid-template-columns: 1fr auto;
            grid-template-rows: auto auto;
            column-gap: 1em;
            padding: 0.6em 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.9em;
            color: var(--text-muted);
            transition: color var(--transition);
        }

        .tx-row:last-child { border-bottom: none; }
        .tx-row:hover { color: var(--text); }

        .tx-name {
            font-weight: 500;
            color: var(--text);
            grid-column: 1;
            grid-row: 1;
        }

        .tx-amount {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.9em;
            grid-column: 2;
            grid-row: 1;
            text-align: right;
        }

        .tx-date {
            font-size: 0.85em;
            grid-column: 1;
            grid-row: 2;
            color: var(--text-faint);
        }

        .tx-balance {
            font-size: 0.85em;
            grid-column: 2;
            grid-row: 2;
            text-align: right;
            color: var(--text-faint);
        }

        .tx-month-header {
            font-family: var(--font-display);
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent-text);
            padding: 1.25em 0 0.5em 0;
            border-bottom: 1px solid var(--border-warm);
            list-style: none;
        }

        /* Positive / negative amount colouring */
        .tx-amount--positive { color: #61f296b7; }
        .tx-amount--negative { color: #fc8888d0; }
        .tx-amount--neutral  { color: var(--text-muted); }
    </style>
</head>
<body>

    <div id="toolbar"></div>

    <div id="auth-container">
        <div>
            <div class="auth__eyebrow">Finance</div>
            <div class="auth__title">Budget<span> Projection</span></div>
        </div>
        <div class="auth__form">
            <input type="email"    id="auth-email"    placeholder="Email"    autocomplete="email">
            <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
            <div class="auth__actions">
                <button type="button" class="button button--primary" id="auth-login-btn">Login</button>
                <button type="button" class="button" id="auth-signup-btn">Sign Up</button>
            </div>
            <div id="auth-message"></div>
        </div>
    </div>

    <div id="app-container">
        <div class="balance-row">
            <div class="balance-field">
                <label for="balanceInput">Starting Balance</label>
                <input type="number" inputmode="numeric" id="balanceInput" name="balanceInput" min="0" placeholder="Starting balance">
            </div>
            <button id="recalcButton" class="button button--primary">Calculate</button>
        </div>
        <div id="txBucket">
            <ul id="txList"></ul>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        import { initToolbar } from './js/toolbar.js';
        import './js/auth.js';
        import './js/app.js';
        initToolbar();
    </script>

</body>
</html>
