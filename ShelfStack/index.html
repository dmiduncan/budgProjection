<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShelfStack</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="shortcut icon" type="image/x-icon" href="shelfStack.ico">
    <style>
        /* ── Toolbar ── */
        #toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            border-bottom: solid 1px rgba(212, 212, 255, 0.1);
        }

        .toolbar__inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6em 2em;
            max-width: 1400px;
            margin: 0 auto;
        }

        .toolbar__brand {
            display: flex;
            align-items: center;
            gap: 0.75em;
        }

        .toolbar__logo {
            font-size: 1em;
            font-weight: 700;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, #9bf1ff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .toolbar__nav {
            display: flex;
            align-items: center;
            gap: 0.25em;
        }

        .toolbar__btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            background: transparent !important;
            border: none;
            color: rgba(244, 244, 255, 0.6);
            cursor: pointer;
            transition: color 0.2s ease, background-color 0.2s ease;
        }

        .toolbar__btn:hover {
            color: rgba(244, 244, 255, 1) !important;
            background: rgba(255, 255, 255, 0.06) !important;
        }

        .toolbar__btn--hidden {
            display: none !important;
        }

        /* ── Auth form ── */
        #auth-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 56px);
            padding: 2em;
            gap: 1em;
        }

        .auth__title {
            font-size: 1.5em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.5em;
            background: linear-gradient(135deg, #9bf1ff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth__form {
            display: flex;
            flex-direction: column;
            gap: 0.75em;
            width: 100%;
            max-width: 320px;
        }

        .auth__actions {
            display: flex;
            gap: 0.75em;
            margin-top: 0.25em;
        }

        .auth__actions .button {
            flex: 1;
        }

        #auth-message {
            font-size: 0.85em;
            color: rgba(244, 244, 255, 0.6);
            text-align: center;
            min-height: 1.2em;
        }

        /* ── Toast ── */
        #toast-container {
            position: fixed;
            bottom: 1.5em;
            right: 1.5em;
            display: flex;
            flex-direction: column;
            gap: 0.5em;
            z-index: 9999;
            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 0.5em;
            padding: 0.65em 1em;
            background: #2a2f4a;
            border: solid 1px rgba(212, 212, 255, 0.15);
            font-size: 0.875em;
            color: #ffffff;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: auto;
            max-width: 320px;
        }

        .toast--visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast--success { border-left: 3px solid #4ade80; }
        .toast--error   { border-left: 3px solid #f87171; }
        .toast--info    { border-left: 3px solid #9bf1ff; }

        .toast__icon {
            font-size: 0.9em;
            flex-shrink: 0;
        }

        .toast--success .toast__icon { color: #4ade80; }
        .toast--error   .toast__icon { color: #f87171; }
        .toast--info    .toast__icon { color: #9bf1ff; }

        /* ── App container ── */
        #app-container {
            display: none;
            padding: 2em 15%;
        }

        @media (max-width: 900px) {
            #app-container { padding: 2em 5%; }
            .toolbar__inner { padding: 0.6em 1em; }
        }

        /* ── Existing styles carried forward ── */
        .media-image-row {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 0.5em;
        }

        .media-image {
            width: 120px;
            height: 180px;
            object-fit: cover;
            border: solid 1px rgba(212, 212, 255, 0.1);
        }

        .media-image-placeholder {
            width: 120px;
            height: 180px;
            border: solid 1px rgba(212, 212, 255, 0.1);
            background: rgba(212, 212, 255, 0.035);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5em;
            text-align: center;
            font-size: 0.85em;
            color: rgba(244, 244, 255, 0.6);
            word-wrap: break-word;
            overflow: hidden;
        }

        .media-top-section {
            display: flex;
            flex-direction: column;
            gap: 0.5em;
            width: 100%;
            align-items: center;
        }

        .media-info {
            display: flex;
            flex-direction: column;
            gap: 0.75em;
            width: 100%;
            align-items: center;
            margin-top: auto;
        }

        .media-info-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5em;
            width: 90%;
        }

        .media-title  { font-size: 1.35em; font-weight: 600; text-align: center; }
        .media-writer { font-size: 1em; color: rgba(244, 244, 255, 0.8); font-weight: 300; text-align: center; }
        .media-detail { font-size: 0.9em; color: rgba(244, 244, 255, 0.8); text-align: center; }
        .media-detail strong { color: #ffffff; font-weight: 600; }

        .progress-container { width: 100%; max-width: 250px; }

        .progress-bar-wrapper {
            background: rgba(212, 212, 255, 0.035);
            height: 1.5em;
            border: solid 1px rgba(212, 212, 255, 0.1);
            position: relative;
            margin-top: 0.5em;
        }

        .progress-bar   { background: #9bf1ff; height: 100%; transition: width 0.3s ease; }
        .progress-text  {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8em; font-weight: 600; color: #ffffff; z-index: 1;
        }

        .update-button { margin-top: 1em; min-width: 200px; }

        button, .button {
            box-shadow: none !important;
            background-color: transparent !important;
            transition: background-color 0.2s ease-in-out;
        }
        button:hover,  .button:hover  { background-color: rgba(255,255,255,0.05) !important; }
        button:active, .button:active { background-color: rgba(255,255,255,0.1)  !important; }

        .search-container {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2em;
            flex-wrap: wrap;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-input {
            width: 100%;
            padding-right: 2.5em;
            box-sizing: border-box;
        }

        .search-icon-btn {
            position: absolute !important;
            right: 0.5em;
            top: 50%;
            transform: translateY(-50%);
            padding: 0 !important;
            width: 1.5em;
            height: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(244, 244, 255, 0.5);
        }

        .search-icon-btn:hover { color: rgba(244,244,255,0.9) !important; background-color: transparent !important; }

        #media-list {
            margin-top: 2em;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5em;
            justify-content: center;
        }

        .media-container {
            border: solid 1px rgba(212, 212, 255, 0.1);
            padding: 1.5em;
            display: flex;
            flex-direction: column;
            gap: 1em;
            align-items: center;
            text-align: center;
            max-width: 300px;
            flex: 0 1 300px;
            min-width: 250px;
            justify-content: space-between;
        }

        /* ── Streak bar ── */
        .streak-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0;
            margin-bottom: 0;
            flex-wrap: wrap;
            gap: 0;
            max-width: 100%;
        }

        .streak-item {
            display: flex;
            align-items: center;
            gap: 0.5em;
            padding: 0.25em 0.5em;
            position: relative;
            cursor: default;
        }

        .streak-icon {
            font-size: .75em;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            line-height: 1;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .streak-item:has(#book-count)  .streak-icon { background-image: linear-gradient(135deg, #f5c842, #e8853d); }
        .streak-item:has(#manga-count) .streak-icon { background-image: linear-gradient(135deg, #c8d8f0, #7aaee8, #e8f0ff); }
        .streak-item:has(#anime-count) .streak-icon { background-image: linear-gradient(135deg, #f9a8d4, #c084fc, #f9a8d4); }
        .streak-item:has(#tv-count)    .streak-icon { background-image: linear-gradient(135deg, #5eead4, #22d3ee, #5eead4); }
        .streak-item:has(#movie-count) .streak-icon { background-image: linear-gradient(135deg, #e2e2e2, #a0a0a0, #ffffff, #b0b0b0); }

        .streak-count { font-size: .7em; font-weight: 600; color: #9bf1ff; }

        /* ── Modals ── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            position: relative;
            background: #2a2f4a;
            border: solid 1px rgba(212, 212, 255, 0.1);
            padding: 1em;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-top: 0; margin-bottom: 1.5em; }

        .modal-field { margin-bottom: 1.5em; }
        .modal-field label { display: block; margin-bottom: 0.5em; font-size: 0.9em; font-weight: 600; }
        .modal-field input { width: 100%; }

        .modal-buttons {
            display: flex;
            gap: 1em;
            flex-wrap: wrap;
            justify-content: center;
        }
        .modal-buttons .button     { flex: 1; min-width: 120px; }
        .modal-buttons .modal-icon-btn { flex: 0 0 auto; min-width: auto; }

        .modal-cancel-button {
            position: absolute;
            top: 0.1rem; right: 0.1rem;
            padding: 1rem;
            line-height: 1;
            font-size: .75rem;
        }

        .modal-icon-btn {
            padding: 0.6em 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 70px;
            height: 45px;
        }

        #confirmation-modal .modal-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #confirmation-modal .modal-buttons { margin-top: 1em; width: 100%; }
        #confirmation-modal .modal-buttons .button { flex: 1; }

        .search-results-modal .modal-content { max-width: 700px; }

        .search-results-list {
            max-height: 60vh;
            overflow-y: auto;
            margin-bottom: 1em;
        }

        .search-result-item {
            border: solid 1px rgba(212, 212, 255, 0.1);
            padding: 1em;
            margin-bottom: 1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1em;
        }

        .no-results { text-align: center; padding: 2em; color: rgba(244, 244, 255, 0.6); }

        /* ── Autocomplete ── */
        .autocomplete-container { position: relative; width: 100%; }

        .autocomplete-dropdown {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: #2a2f4a;
            border: solid 1px rgba(212, 212, 255, 0.1);
            border-top: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            margin-top: 2px;
        }
        .autocomplete-dropdown.active { display: block; }

        .autocomplete-item {
            padding: 0.5em 0.75em;
            cursor: pointer;
            border-bottom: solid 1px rgba(212, 212, 255, 0.05);
            transition: background-color 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.6em;
        }
        .autocomplete-item:hover  { background-color: rgba(212,212,255,0.1); }
        .autocomplete-item:last-child { border-bottom: none; }

        .autocomplete-item-thumbnail {
            width: 56px; height: 80px;
            object-fit: cover;
            border: solid 1px rgba(212,212,255,0.1);
            flex-shrink: 0;
        }
        .autocomplete-item-thumbnail--placeholder {
            width: 28px; height: 40px;
            flex-shrink: 0;
            background: rgba(212,212,255,0.05);
            border: solid 1px rgba(212,212,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: 700;
            color: rgba(244,244,255,0.4);
            text-transform: uppercase;
        }

        .autocomplete-item-content { flex: 1; min-width: 0; }
        .autocomplete-item-title   { font-weight: 600; font-size: 0.95em; margin-bottom: 0.25em; }
        .autocomplete-item-details { font-size: 0.85em; color: rgba(244,244,255,0.7); }
        .autocomplete-item-details strong { color: rgba(244,244,255,0.9); }

        .autocomplete-item-track {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .autocomplete-tracked-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9bf1ff;
            width: 28px; height: 28px;
        }

        .autocomplete-track-btn {
            padding: 0.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 28px; height: 28px;
        }

        .search-track-btn,
        .search-mark-done-btn {
            padding: 0.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 32px; height: 32px;
        }

        .search-tracked-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #949494;
            width: 32px; height: 32px;
        }

        .progress-with-tooltip { position: relative; cursor: default; }

        .series-tooltip {
            position: absolute;
            bottom: 125%; left: 50%;
            transform: translateX(-50%);
            background: #2a2f4a;
            color: #e8eaff;
            border: 1px solid #3a3f66;
            padding: 6px 10px;
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.2;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 20;
        }

        .progress-with-tooltip:hover .series-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-4px);
        }

        @media (pointer: coarse) {
            .autocomplete-item-thumbnail,
            .autocomplete-item-thumbnail--placeholder { display: none; }
        }
    </style>
</head>
<body>

    <!-- Always-present toolbar -->
    <div id="toolbar"></div>

    <!-- Auth form — shown when logged out, hidden when logged in -->
    <div id="auth-container">
        <div class="auth__title">shelfSTACK</div>
        <div class="auth__form">
            <input type="email"    id="auth-email"    placeholder="Email"    autocomplete="email">
            <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
            <div class="auth__actions">
                <button type="button" class="button" id="auth-login-btn">Login</button>
                <button type="button" class="button" id="auth-signup-btn">Sign Up</button>
            </div>
            <div id="auth-message"></div>
        </div>
    </div>

    <!-- Main app — shown when logged in -->
    <div id="app-container">
        <div class="streak-bar">
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Books</span>
                <span class="streak-count" id="book-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Manga</span>
                <span class="streak-count" id="manga-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Anime</span>
                <span class="streak-count" id="anime-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">TV Shows</span>
                <span class="streak-count" id="tv-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Films</span>
                <span class="streak-count" id="movie-count">0</span>
            </div>
        </div>

        <div class="search-container">
            <div class="search-input-wrapper autocomplete-container">
                <input type="text" id="search-input" class="search-input" autocomplete="off" placeholder="Search for media…">
                <button type="button" id="search-btn" class="search-icon-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
                <div id="autocomplete-dropdown" class="autocomplete-dropdown"></div>
            </div>
        </div>

        <div id="media-list"></div>
    </div>

    <!-- Update Progress Modal -->
    <div id="update-modal" class="modal-overlay">
        <div class="modal-content">
            <button type="button" class="button modal-cancel-button" id="modal-cancel-btn">✕</button>
            <h3>Update Progress</h3>
            <div class="modal-field">
                <label id="current-progress-label">Current Progress:</label>
                <div id="current-progress-value"
                     style="padding:0.5em; background:rgba(212,212,255,0.035); border:solid 1px rgba(212,212,255,0.1); margin-top:0.5em;"></div>
            </div>
            <div class="modal-field">
                <label id="modal-update-label">New Progress:</label>
                <input type="number" id="modal-update-input" min="0" placeholder="Enter new value">
            </div>
            <div class="modal-buttons">
                <button type="button" class="button modal-icon-btn" id="modal-save-btn" title="Save progress">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                </button>
                <button type="button" class="button modal-icon-btn" id="modal-finish-btn" title="Mark as completed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="9 12 11 14 15 10"/>
                    </svg>
                </button>
                <button type="button" class="button modal-icon-btn" id="modal-dnf-btn" title="Did not finish">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <text x="12" y="16" font-family="system-ui,-apple-system,sans-serif"
                              font-size="13" font-weight="700" fill="currentColor"
                              text-anchor="middle" dominant-baseline="middle">DNF</text>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Search Results Modal -->
    <div id="search-modal" class="modal-overlay search-results-modal">
        <div class="modal-content">
            <button type="button" class="button modal-cancel-button" id="search-modal-close-btn">✕</button>
            <h3>Search Results</h3>
            <div id="search-results-list" class="search-results-list"></div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal-overlay">
        <div class="modal-content">
            <label id="modal-confirmation-label">Are you sure?</label>
            <div class="modal-buttons">
                <button type="button" class="button" id="modal-confirm-yes">Yes</button>
                <button type="button" class="button" id="modal-confirm-no">No</button>
            </div>
        </div>
    </div>

    <!-- Toast container (populated by toast.js) -->
    <div id="toast-container"></div>

    <!-- Single entry point — load order matters to prevent race conditions.
         ES modules are singletons, so auth.js imported here and by toolbar.js
         resolve to the same instance. All listeners register before async auth fires. -->
    <script type="module">
        import { initToolbar } from './js/toolbar.js';
        import './js/auth.js';
        import './js/media-tracker.js';
        initToolbar();
    </script>

</body>
</html>
