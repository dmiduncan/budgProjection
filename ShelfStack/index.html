<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShelfStack</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="shortcut icon" type="image/x-icon" href="shelfStack.ico">
    <style>
        /* ── ShelfStack-specific styles ── */

        /* Search bar */
        .search-container {
            display: flex;
            gap: 0.75em;
            align-items: center;
            margin-bottom: 2em;
            flex-wrap: wrap;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-input-wrapper input { padding-right: 2.5em; }

        .search-icon-btn {
            position: absolute;
            right: 0.6em;
            top: 50%;
            transform: translateY(-50%);
            padding: 0;
            width: 1.5em;
            height: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-faint);
            cursor: pointer;
            transition: color var(--transition);
            box-shadow: none;
            font-size: 1em;
            text-transform: none;
            letter-spacing: 0;
        }

        .search-icon-btn:hover {
            color: var(--accent-text);
            background: transparent;
            border-color: transparent;
        }

        /* Streak bar */
        .streak-bar {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 0.15em;
            margin-bottom: 0.75em;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .streak-bar::-webkit-scrollbar { display: none; }

        .streak-item {
            display: flex;
            align-items: center;
            gap: 0.3em;
            padding: 0.2em 0.5em;
            cursor: default;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .streak-item + .streak-item { border-left: 1px solid var(--border); }

        .streak-icon {
            font-family: var(--font-display);
            font-size: 0.6em;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .streak-item:has(#book-count)  .streak-icon { background-image: linear-gradient(135deg, #f5c842, #e8853d); }
        .streak-item:has(#manga-count) .streak-icon { background-image: linear-gradient(135deg, #c8d8f0, #7aaee8); }
        .streak-item:has(#anime-count) .streak-icon { background-image: linear-gradient(135deg, #f9a8d4, #c084fc); }
        .streak-item:has(#tv-count)    .streak-icon { background-image: linear-gradient(135deg, #5eead4, #22d3ee); }
        .streak-item:has(#movie-count) .streak-icon { background-image: linear-gradient(135deg, #e2e2e2, #a0a0a0); }

        .streak-count {
            font-size: 0.65em;
            font-weight: 600;
            color: var(--accent-text);
        }

        /* Media grid */
        #media-list {
            margin-top: 1.5em;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 1.25em;
        }

        .media-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.25em 1em;
            display: flex;
            flex-direction: column;
            gap: 0.75em;
            align-items: center;
            text-align: center;
            transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
            position: relative;
            overflow: hidden;
        }

        .media-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent);
            opacity: 0;
            transition: opacity var(--transition);
        }

        .media-container:hover {
            border-color: var(--border-warm);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 0 1px var(--border-warm);
        }

        .media-container:hover::before { opacity: 1; }

        /* Card image */
        .media-image-row {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .media-image {
            width: 110px;
            height: 165px;
            object-fit: cover;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .media-image-placeholder {
            width: 110px;
            height: 165px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5em;
            text-align: center;
            font-size: 0.8em;
            color: var(--text-faint);
            word-wrap: break-word;
            overflow: hidden;
        }

        /* Card text */
        .media-top-section {
            display: flex;
            flex-direction: column;
            gap: 0.4em;
            width: 100%;
            align-items: center;
        }

        .media-info {
            display: flex;
            flex-direction: column;
            gap: 0.5em;
            width: 100%;
            align-items: center;
            margin-top: auto;
        }

        .media-info-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5em;
            width: 90%;
        }

        .media-title {
            font-family: var(--font-display);
            font-size: 1em;
            font-weight: 700;
            text-align: center;
            line-height: 1.3;
            color: var(--text);
        }

        .media-writer {
            font-size: 0.85em;
            color: var(--text-muted);
            font-weight: 300;
            text-align: center;
        }

        .media-detail {
            font-size: 0.82em;
            color: var(--text-muted);
            text-align: center;
        }

        .media-detail strong {
            color: var(--accent-text);
            font-weight: 600;
        }

        /* Progress bar */
        .progress-container {
            width: 100%;
            max-width: 220px;
        }

        .progress-bar-wrapper {
            background: var(--surface-3);
            height: 6px;
            border-radius: 3px;
            margin-top: 0.4em;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            background: var(--accent);
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 20px;
            background: linear-gradient(to right, transparent, rgba(124,92,252,0.6));
        }

        .progress-text {
            font-family: var(--font-display);
            font-size: 0.72em;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 0.4em;
            text-align: center;
            letter-spacing: 0.04em;
        }

        .update-button {
            margin-top: 0.5em;
            width: 100%;
            max-width: 220px;
        }

        /* Autocomplete */
        .autocomplete-container { position: relative; width: 100%; }

        .autocomplete-dropdown {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 var(--radius) var(--radius);
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            margin-top: 2px;
        }
        .autocomplete-dropdown.active { display: block; }

        .autocomplete-item {
            padding: 0.5em 0.75em;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.6em;
        }
        .autocomplete-item:hover        { background: rgba(124,92,252,0.08); }
        .autocomplete-item:last-child   { border-bottom: none; }

        .autocomplete-item-thumbnail {
            width: 56px; height: 80px;
            object-fit: cover;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            flex-shrink: 0;
        }
        .autocomplete-item-thumbnail--placeholder {
            width: 28px; height: 40px;
            flex-shrink: 0;
            background: var(--surface-3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: 700;
            color: var(--text-faint);
            text-transform: uppercase;
        }

        .autocomplete-item-content  { flex: 1; min-width: 0; }
        .autocomplete-item-title    { font-weight: 600; font-size: 0.95em; margin-bottom: 0.25em; }
        .autocomplete-item-details  { font-size: 0.85em; color: var(--text-muted); }
        .autocomplete-item-details strong { color: var(--text); }

        .autocomplete-item-track    { display: flex; align-items: center; flex-shrink: 0; }

        .autocomplete-tracked-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-text);
            width: 28px; height: 28px;
        }

        .autocomplete-track-btn {
            padding: 0.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 28px; height: 28px;
            background: transparent;
            border-color: transparent;
            color: var(--text-muted);
        }

        .autocomplete-track-btn:hover {
            background: transparent;
            border-color: transparent;
            color: var(--accent-text);
        }

        .search-track-btn,
        .search-mark-done-btn {
            padding: 0.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 32px; height: 32px;
        }

        .search-tracked-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-faint);
            width: 32px; height: 32px;
        }

        /* Tooltip */
        .progress-with-tooltip { position: relative; cursor: default; }

        .series-tooltip {
            position: absolute;
            bottom: 125%; left: 50%;
            transform: translateX(-50%);
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 6px 10px;
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.2;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 20;
        }

        .progress-with-tooltip:hover .series-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-4px);
        }

        /* Current progress display in modal */
        #current-progress-value {
            padding: 0.5em 0.85em;
            background: var(--surface-3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-top: 0.25em;
            font-size: 0.95em;
            color: var(--text-muted);
        }

        @media (pointer: coarse) {
            .autocomplete-item-thumbnail,
            .autocomplete-item-thumbnail--placeholder { display: none; }
        }
    </style>
</head>
<body>

    <div id="toolbar"></div>

    <div id="auth-container">
        <div>
            <div class="auth__eyebrow">Your Media Tracker</div>
            <div class="auth__title">shelf<span>STACK</span></div>
        </div>
        <div class="auth__form">
            <input type="email"    id="auth-email"    placeholder="Email"    autocomplete="email">
            <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
            <div class="auth__actions">
                <button type="button" class="button button--primary" id="auth-login-btn">Login</button>
                <button type="button" class="button" id="auth-signup-btn">Sign Up</button>
            </div>
            <div id="auth-message"></div>
        </div>
    </div>

    <div id="app-container">
        <div class="streak-bar">
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Books</span>
                <span class="streak-count" id="book-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Manga</span>
                <span class="streak-count" id="manga-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Anime</span>
                <span class="streak-count" id="anime-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">TV Shows</span>
                <span class="streak-count" id="tv-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Films</span>
                <span class="streak-count" id="movie-count">0</span>
            </div>
        </div>

        <div class="search-container">
            <div class="search-input-wrapper autocomplete-container">
                <input type="text" id="search-input" class="search-input" autocomplete="off" placeholder="Search for media…">
                <button type="button" id="search-btn" class="search-icon-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
                <div id="autocomplete-dropdown" class="autocomplete-dropdown"></div>
            </div>
        </div>

        <div id="media-list"></div>
    </div>

    <!-- Update Progress Modal -->
    <div id="update-modal" class="modal-overlay">
        <div class="modal-content">
            <button type="button" class="button modal-cancel-button" id="modal-cancel-btn">✕</button>
            <h3>Update Progress</h3>
            <div class="modal-field">
                <label id="current-progress-label">Current Progress</label>
                <div id="current-progress-value"></div>
            </div>
            <div class="modal-field">
                <label id="modal-update-label">New Progress</label>
                <input type="number" id="modal-update-input" min="0" placeholder="Enter new value">
            </div>
            <div class="modal-buttons">
                <button type="button" class="button modal-icon-btn" id="modal-save-btn" title="Save progress">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                </button>
                <button type="button" class="button modal-icon-btn" id="modal-finish-btn" title="Mark as completed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="9 12 11 14 15 10"/>
                    </svg>
                </button>
                <button type="button" class="button modal-icon-btn" id="modal-dnf-btn" title="Did not finish">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <text x="12" y="16" font-family="system-ui,-apple-system,sans-serif"
                              font-size="13" font-weight="700" fill="currentColor"
                              text-anchor="middle" dominant-baseline="middle">DNF</text>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Search Results Modal -->
    <div id="search-modal" class="modal-overlay search-results-modal">
        <div class="modal-content">
            <button type="button" class="button modal-cancel-button" id="search-modal-close-btn">✕</button>
            <h3>Search Results</h3>
            <div id="search-results-list" class="search-results-list"></div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal-overlay">
        <div class="modal-content">
            <label id="modal-confirmation-label">Are you sure?</label>
            <div class="modal-buttons">
                <button type="button" class="button" id="modal-confirm-yes">Yes</button>
                <button type="button" class="button" id="modal-confirm-no">No</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        import { initToolbar } from './js/toolbar.js';
        import './js/auth.js';
        import './js/media-tracker.js';
        initToolbar();
    </script>

</body>
</html>
