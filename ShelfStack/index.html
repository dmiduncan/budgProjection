<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShelfStack</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="shortcut icon" type="image/x-icon" href="shelfStack.ico">
    <style>
        .media-image-row {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 0.5em;
        }

        .media-image {
            width: 120px;
            height: 180px;
            object-fit: cover;
            border: solid 1px rgba(212, 212, 255, 0.1);
        }

        .media-image-placeholder {
            width: 120px;
            height: 180px;
            border: solid 1px rgba(212, 212, 255, 0.1);
            background: rgba(212, 212, 255, 0.035);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5em;
            text-align: center;
            font-size: 0.85em;
            color: rgba(244, 244, 255, 0.6);
            word-wrap: break-word;
            overflow: hidden;
        }

        .media-top-section {
            display: flex;
            flex-direction: column;
            gap: 0.5em;
            width: 100%;
            align-items: center;
        }

        .media-info {
            display: flex;
            flex-direction: column;
            gap: 0.75em;
            width: 100%;
            align-items: center;
            margin-top: auto;
        }

        .media-info-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5em;
            width: 90%;
        }

        .media-title {
            font-size: 1.35em;
            font-weight: 600;
            text-align: center;
        }

        .media-writer {
            font-size: 1em;
            color: rgba(244, 244, 255, 0.8);
            font-weight: 300;
            text-align: center;
        }

        .media-detail {
            font-size: 0.9em;
            color: rgba(244, 244, 255, 0.8);
            text-align: center;
        }

        .media-detail strong {
            color: #ffffff;
            font-weight: 600;
        }

        .progress-container {
            width: 100%;
            max-width: 250px;
        }

        .media-detail {
            font-size: 0.9em;
            color: rgba(244, 244, 255, 0.8);
        }

        .media-detail strong {
            color: #ffffff;
            font-weight: 600;
        }

        .progress-container {
            flex: 1;
            min-width: 100px;
        }

        .progress-bar-wrapper {
            background: rgba(212, 212, 255, 0.035);
            height: 1.5em;
            border: solid 1px rgba(212, 212, 255, 0.1);
            position: relative;
            margin-top: 0.5em;
        }

        .progress-bar {
            background: #9bf1ff;
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8em;
            font-weight: 600;
            color: #ffffff;
            z-index: 1;
        }

        .update-button {
            margin-top: 1em;
            min-width: 200px;
        }

        /* Remove white outline from buttons and add hover effect */
        button,
        .button {
            box-shadow: none !important;
            background-color: transparent !important;
            transition: background-color 0.2s ease-in-out;
        }

        button:hover,
        .button:hover {
            box-shadow: none !important;
            background-color: rgba(255, 255, 255, 0.05) !important;
        }

        button:active,
        .button:active {
            box-shadow: none !important;
            background-color: rgba(255, 255, 255, 0.1) !important;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
        }

        .search-container {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2em;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
        }

        #media-list {
            margin-top: 2em;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5em;
            justify-content: center;
        }

        .media-container {
            border: solid 1px rgba(212, 212, 255, 0.1);
            padding: 1.5em;
            margin-bottom: 0;
            display: flex;
            flex-direction: column;
            gap: 1em;
            align-items: center;
            text-align: center;
            max-width: 300px;
            flex: 0 1 300px;
            min-width: 250px;
            justify-content: space-between;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            background: #2a2f4a;
            border: solid 1px rgba(212, 212, 255, 0.1);
            padding: 1em;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 1.5em;
        }

        .modal-field {
            margin-bottom: 1.5em;
        }

        .modal-field label {
            display: block;
            margin-bottom: 0.5em;
            font-size: 0.9em;
            font-weight: 600;
        }

        .modal-field input {
            width: 100%;
        }

        .modal-buttons {
            display: flex;
            gap: 1em;
            flex-wrap: wrap;
            margin-top: 0em;
        }

        .modal-buttons .button {
            flex: 1;
            min-width: 120px;
        }

        /* Search Results Modal */
        .search-results-modal .modal-content {
            max-width: 700px;
        }

        .search-result-item {
            border: solid 1px rgba(212, 212, 255, 0.1);
            padding: 1em;
            margin-bottom: 1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1em;
        }

        .search-result-info {
            flex: 1;
        }

        .search-result-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 0.25em;
        }

        .search-result-details {
            font-size: 0.9em;
            color: rgba(244, 244, 255, 0.8);
        }

        .search-result-details strong {
            color: #ffffff;
            font-weight: 600;
        }

        .search-result-item .button {
            flex-shrink: 0;
        }

        .search-results-list {
            max-height: 60vh;
            overflow-y: auto;
            margin-bottom: 1em;
        }

        .no-results {
            text-align: center;
            padding: 2em;
            color: rgba(244, 244, 255, 0.6);
        }

        .modal-cancel-button {
            position: absolute;
            top: 0.1rem;
            right: 0.1rem;
            padding: 1rem 1rem;
            line-height: 1;
            font-size: .75rem;
        }

        #confirmation-modal .modal-content {
            display: flex;
            flex-direction: column;  
            align-items: center;     
            justify-content: center;  
            text-align: center;   
        }

        #confirmation-modal .button {
            margin-top: 10px;
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        
        #confirmation-modal .modal-buttons .button {
            flex: 1;
        }

        /* Streak Bar Styles */
        .streak-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0em 0;
            margin-bottom: 0;
            flex-wrap: wrap;
            gap: 0em;
            max-width: 100%;
        }

        .streak-item {
            display: flex;
            align-items: center;
            gap: 0.5em;
            padding: 0.25em 0.5em;
            transition: background-color 0.2s ease;
            position: relative;
            cursor: default;
        }

        /* ── Gradient text labels ── */
        .streak-icon {
            font-size: .75em;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            line-height: 1;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: filter 0.2s ease;
        }

        .streak-item:hover .streak-icon {
            filter: brightness(1.3);
        }

        /* Books — amber/gold */
        #book-count ~ .tooltip { color: #fff; }
        .streak-item:has(#book-count) .streak-icon {
            background-image: linear-gradient(135deg, #f5c842, #e8853d);
        }

        /* Manga — ice blue */
        .streak-item:has(#manga-count) .streak-icon {
            background-image: linear-gradient(135deg, #c8d8f0, #7aaee8, #e8f0ff);
        }

        /* Anime — sakura pink/violet */
        .streak-item:has(#anime-count) .streak-icon {
            background-image: linear-gradient(135deg, #f9a8d4, #c084fc, #f9a8d4);
        }

        /* TV Shows — teal/cyan */
        .streak-item:has(#tv-count) .streak-icon {
            background-image: linear-gradient(135deg, #5eead4, #22d3ee, #5eead4);
        }

        /* Films — silver chrome */
        .streak-item:has(#movie-count) .streak-icon {
            background-image: linear-gradient(135deg, #e2e2e2, #a0a0a0, #ffffff, #b0b0b0);
        }

        .streak-count {
            font-size: .7em;
            font-weight: 600;
            color: #9bf1ff;
        }

        .streak-item .tooltip {
            visibility: hidden;
            background-color: #2a2f4a;
            color: #ffffff;
            text-align: center;
            padding: 0.5em 0.75em;
            border: solid 1px rgba(212, 212, 255, 0.1);
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 0.85em;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .streak-item .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #2a2f4a transparent transparent transparent;
        }

        .streak-item:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .progress-with-tooltip {
            position: relative;
            cursor: default;
        }

        .series-tooltip {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);

            background: #2a2f4a;
            color: #e8eaff;
            border: 1px solid #3a3f66;

            padding: 6px 10px;
            border-radius: 6px;

            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.2;
            white-space: nowrap;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 20;
        }

        series-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);

            border-width: 6px;
            border-style: solid;
            border-color: #2a2f4a transparent transparent transparent;
        }

        .progress-with-tooltip:hover .series-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-4px);
        }
    </style>
</head>
<body>
    <div id="app-container" style="padding: 2em 15%; display:none;">
        <div class="header-container">
            <h3>shelfSTACK</h3>
        </div>
        <div class="streak-bar">
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Books</span>
                <span class="streak-count" id="book-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Manga</span>
                <span class="streak-count" id="manga-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Anime</span>
                <span class="streak-count" id="anime-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">TV Shows</span>
                <span class="streak-count" id="tv-count">0</span>
            </div>
            <div class="streak-item" style="display:none;">
                <span class="streak-icon">Films</span>
                <span class="streak-count" id="movie-count">0</span>
            </div>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Search for media...">
            <button type="button" id="search-btn" class="button">Search</button>
        </div>
        <div id="media-list">
            <!-- Media items will be dynamically inserted here -->
        </div>
    </div>

    <!-- Update Modal -->
    <div id="update-modal" class="modal-overlay">
        <div class="modal-content">
            <button type="button" class="button modal-cancel-button" id="modal-cancel-btn">x</button>
            <h3>Update Progress</h3>
            <div class="modal-field">
                <label id="current-progress-label">Current Page/Episode:</label>
                <div id="current-progress-value" style="padding: 0.5em; background: rgba(212, 212, 255, 0.035); border: solid 1px rgba(212, 212, 255, 0.1); margin-top: 0.5em;">
                    <!-- Current value will be inserted here -->
                </div>
            </div>
            <div class="modal-field">
                <label id="modal-update-label">New Progress:</label>
                <input type="number" id="modal-update-input" style="color: grey" min="0" value="" placeholder="Enter new value">
            </div>
            <div class="modal-buttons">
                <button type="button" class="button" id="modal-save-btn">Update</button>
                <button type="button" class="button" id="modal-finish-btn">Finish</button>
                <button type="button" class="button" id="modal-dnf-btn">DNF</button>
            </div>
        </div>
    </div>

    <!-- Search Results Modal -->
    <div id="search-modal" class="modal-overlay search-results-modal">
        <div class="modal-content">
            <button type="button" class="button modal-cancel-button" id="search-modal-close-btn">x</button>
            <h3>Search Results</h3>
            <div id="search-results-list" class="search-results-list">
                <!-- Search results will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
     <div id="confirmation-modal" class="modal-overlay">
        <div class="modal-content">
            <label id="modal-confirmation-label">THis is BrokeEN</label>
            <div class="modal-buttons">
                <button type="button" class="button" id="modal-confirm-yes">Yes</button>
                <button type="button" class="button" id="modal-confirm-no">No</button>
            </div>
        </div>
     </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
