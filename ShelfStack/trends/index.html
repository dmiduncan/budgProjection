<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Trends</title>
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        #app-container {
            display: block;
            padding: 2em 12%;
        }
        @media (max-width: 900px) {
            #app-container { padding: 1.5em 4%; }
        }
        .trends-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5em;
            margin-top: 1.5em;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.25em;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }
        .card__label {
            font-family: var(--font-display);
            font-size: 0.7em;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 1.1em;
        }
        .view-controls {
            display: flex;
            align-items: center;
            gap: 0.6em;
            flex-wrap: wrap;
            margin: 0.25em 0 0.5em;
            padding: 0.45em 0.55em;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
        }
        .view-toggle {
            display: inline-flex;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface-2);
        }
        .view-toggle__btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 0.45em 0.75em;
            font-size: 0.78em;
            cursor: pointer;
        }
        .view-toggle__btn.active {
            background: rgba(124,92,252,0.18);
            color: var(--accent-text);
        }
        .view-month {
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-muted);
            border-radius: var(--radius);
            padding: 0.35em 0.55em;
            font-size: 0.78em;
        }
        .view-month[hidden] { display: none; }
        .streak-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.7em;
        }
        .streak-pill {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.6em 0.7em;
            background: var(--surface-2);
        }
        .streak-pill__name { font-size: 0.78em; color: var(--text-muted); }
        .streak-pill__count {
            font-family: var(--font-display);
            font-size: 1.05em;
            color: var(--accent-text);
            margin-top: 0.1em;
        }
        .streak-pill__date { font-size: 0.72em; color: var(--text-faint); margin-top: 0.25em; }
        .streak-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.15em;
            margin-bottom: 0.75em;
            overflow-x: hidden;
        }
        .streak-bar::-webkit-scrollbar { display: none; }
        .streak-item {
            display: flex;
            align-items: center;
            gap: 0.3em;
            padding: 0.2em 0.5em;
            cursor: default;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .streak-item + .streak-item { border-left: 1px solid var(--border); }
        .streak-icon {
            font-family: var(--font-display);
            font-size: 0.6em;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .streak-item:has(#book-count)  .streak-icon { background-image: linear-gradient(135deg, #f5c842, #e8853d); }
        .streak-item:has(#manga-count) .streak-icon { background-image: linear-gradient(135deg, #c8d8f0, #7aaee8); }
        .streak-item:has(#anime-count) .streak-icon { background-image: linear-gradient(135deg, #f9a8d4, #c084fc); }
        .streak-item:has(#tv-count)    .streak-icon { background-image: linear-gradient(135deg, #5eead4, #22d3ee); }
        .streak-item:has(#movie-count) .streak-icon { background-image: linear-gradient(135deg, #e2e2e2, #a0a0a0); }
        .streak-count {
            font-size: 0.65em;
            font-weight: 600;
            color: var(--accent-text);
        }
        @media (max-width: 640px) {
            .streak-item {
                padding: 0.15em 0.4em;
                gap: 0.22em;
            }
            .streak-icon { font-size: 0.56em; }
            .streak-count { font-size: 0.6em; }
        }
        .year-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1em;
        }
        .year-section { min-width: 0; }
        .year-section h4 {
            margin: 0 0 0.6em;
            font-size: 0.82em;
            color: var(--text-muted);
            font-weight: 600;
        }
        .year-table-wrap {
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .year-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78em;
        }
        .year-table th,
        .year-table td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.45em 0.6em;
            text-align: right;
            white-space: nowrap;
        }
        .year-table th:first-child,
        .year-table td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background: var(--surface-2);
        }
        .year-table thead th {
            font-weight: 700;
            color: var(--text-muted);
            background: var(--surface-2);
        }
        .plot-wrap {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .plot-wrap svg {
            background: transparent !important;
            display: block;
            max-width: 100%;
            height: auto;
        }
        .pie-pair {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 0.55em;
            align-items: start;
        }
        @media (min-width: 641px) {
            .pie-pair { gap: 1.25em; }
        }
        .pie-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5em;
            min-width: 0;
        }
        @media (min-width: 641px) {
            .pie-col { gap: 0.75em; }
        }
        .pie-col__title {
            margin: 0;
            font-size: 0.72em;
            color: var(--text-muted);
            font-weight: 600;
            text-align: center;
            line-height: 1.25;
        }
        @media (min-width: 641px) {
            .pie-col__title { font-size: 0.82em; }
        }
        .pie-wheel {
            width: 100%;
            max-width: min(200px, 34vw);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px solid var(--border);
            flex-shrink: 0;
            margin-inline: auto;
        }
        @media (min-width: 641px) {
            .pie-wheel { max-width: 200px; }
        }
        .pie-legend {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            max-width: 100%;
            font-size: 0.68em;
            color: var(--text-muted);
        }
        @media (min-width: 641px) {
            .pie-legend { font-size: 0.78em; }
        }
        .pie-legend li {
            display: flex;
            align-items: center;
            gap: 0.5em;
            justify-content: space-between;
            margin-bottom: 0.35em;
        }
        .pie-legend__left { display: flex; align-items: center; gap: 0.45em; min-width: 0; }
        .pie-legend__swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .pie-legend__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pie-legend li.pie-empty {
            justify-content: center;
            text-align: center;
            white-space: normal;
            color: var(--text-faint);
            font-size: 0.9em;
        }
        .note { color: var(--text-faint); font-size: 0.8em; margin-top: 0.55em; }
        .full-span { grid-column: 1 / -1; }
        .status {
            color: var(--text-muted);
            font-size: 0.95em;
            margin-top: 1em;
        }
        @media (max-width: 1120px) {
            .year-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="toolbar"></div>
<div id="app-container">
    <div class="status" id="status-text">Loading trends...</div>
    <div class="view-controls" id="view-controls">
        <div class="view-toggle">
            <button type="button" class="view-toggle__btn active" id="period-year-btn">Year</button>
            <button type="button" class="view-toggle__btn" id="period-month-btn">Month</button>
        </div>
        <select id="month-select" class="view-month" hidden></select>
    </div>
    <div class="trends-grid" id="trends-grid" style="display:none;">
        <div class="card">
            <div class="card__label">Active Streaks</div>
            <div class="streak-bar" id="streaks-container">
                <div class="streak-item">
                    <span class="streak-icon">Books</span>
                    <span class="streak-count" id="book-count">0</span>
                </div>
                <div class="streak-item">
                    <span class="streak-icon">Manga</span>
                    <span class="streak-count" id="manga-count">0</span>
                </div>
                <div class="streak-item">
                    <span class="streak-icon">Anime</span>
                    <span class="streak-count" id="anime-count">0</span>
                </div>
                <div class="streak-item">
                    <span class="streak-icon">TV Shows</span>
                    <span class="streak-count" id="tv-count">0</span>
                </div>
                <div class="streak-item">
                    <span class="streak-icon">Films</span>
                    <span class="streak-count" id="movie-count">0</span>
                </div>
            </div>
        </div>
        <div class="card full-span">
            <div class="card__label" id="scope-pie-label">Current Year</div>
            <div class="pie-pair">
                <div class="pie-col">
                    <h3 class="pie-col__title">Completed</h3>
                    <div class="pie-wheel" id="pie-completed-wheel" role="img" aria-label="Media completed by type"></div>
                    <ul class="pie-legend" id="pie-completed-legend"></ul>
                </div>
                <div class="pie-col">
                    <h3 class="pie-col__title">Units logged</h3>
                    <div class="pie-wheel" id="pie-units-wheel" role="img" aria-label="Units logged by type"></div>
                    <ul class="pie-legend" id="pie-units-legend"></ul>
                </div>
            </div>
        </div>
        <div class="card full-span">
            <div class="card__label" id="scope-glance-label">Year At A Glance</div>
            <div class="year-grid">
                <div class="year-section">
                    <h4>Media Completed</h4>
                    <div id="year-total-completed"></div>
                    <h4 style="margin-top:1em;">Average Units Per Day</h4>
                    <div id="year-units-per-day"></div>
                </div>
                <div class="year-section">
                    <h4 id="units-table-heading">Units Per Month</h4>
                    <div id="year-units-by-month"></div>
                    <div id="glance-completed-block">
                        <h4 style="margin-top:1em;" id="completed-table-heading">Completed Per Month</h4>
                        <div id="year-completed-by-month"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card full-span">
            <div class="card__label" id="units-chart-label">Units Per Month</div>
            <div class="plot-wrap" id="chart-units"></div>
        </div>
        <div class="card full-span" id="card-completed-trend">
            <div class="card__label" id="completed-chart-label">Completed Per Month</div>
            <div class="plot-wrap" id="chart-completed"></div>
        </div>
    </div>
</div>
<script type="module">
    import * as Plot from "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm";
    import { initToolbar } from "../js/toolbar.js";
    import { supabase } from "../js/supabase-client.js";

    initToolbar();

    const now = new Date();
    const year = now.getFullYear();
    const currentMonthIndex = now.getMonth();
    const startIso = `${year}-01-01T00:00:00.000Z`;
    const endIso = `${year + 1}-01-01T00:00:00.000Z`;
    const mediaTypes = ["book", "manga", "anime", "tvshow", "movie"];
    const labels = {
        book: "Books",
        manga: "Manga",
        anime: "Anime",
        tvshow: "TV Shows",
        movie: "Movies"
    };
    const legendLabels = {
        book: "Books",
        manga: "Manga",
        anime: "Anime",
        tvshow: "TV",
        movie: "Movies"
    };
    const colors = {
        book: "#f5c842",
        manga: "#7aaee8",
        anime: "#c084fc",
        tvshow: "#22d3ee",
        movie: "#a0a0a0"
    };

    const statusEl = document.getElementById("status-text");
    const viewControlsEl = document.getElementById("view-controls");
    const trendsGrid = document.getElementById("trends-grid");
    const monthSelectEl = document.getElementById("month-select");
    const periodYearBtn = document.getElementById("period-year-btn");
    const periodMonthBtn = document.getElementById("period-month-btn");
    const scopePieLabelEl = document.getElementById("scope-pie-label");
    const scopeGlanceLabelEl = document.getElementById("scope-glance-label");
    const unitsTableHeadingEl = document.getElementById("units-table-heading");
    const completedTableHeadingEl = document.getElementById("completed-table-heading");
    const unitsChartLabelEl = document.getElementById("units-chart-label");
    const completedChartLabelEl = document.getElementById("completed-chart-label");
    const glanceCompletedBlock = document.getElementById("glance-completed-block");
    const cardCompletedTrend = document.getElementById("card-completed-trend");
    const chartCompletedEl = document.getElementById("chart-completed");
    const months = monthNames();
    const viewState = {
        period: "year",
        monthIndex: currentMonthIndex
    };

    function monthNames() {
        return ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    }

    function normalizeType(rawType) {
        const t = String(rawType || "").toLowerCase().trim();
        if (t === "tv show" || t === "tvshow" || t === "tv_shows" || t === "tv shows") return "tvshow";
        if (t === "books") return "book";
        if (t === "movies") return "movie";
        return mediaTypes.includes(t) ? t : null;
    }

    function emptyByType() {
        const base = {};
        mediaTypes.forEach(type => { base[type] = 0; });
        return base;
    }

    function renderSmallTable(containerId, rows) {
        const container = document.getElementById(containerId);
        const table = document.createElement("table");
        table.className = "year-table";
        table.innerHTML = `
            <tbody>
                ${rows.map(r => `<tr><td>${r.label}</td><td>${r.value}</td></tr>`).join("")}
            </tbody>
        `;
        const wrap = document.createElement("div");
        wrap.className = "year-table-wrap";
        wrap.append(table);
        container.innerHTML = "";
        container.append(wrap);
    }

    function renderMatrixTable(containerId, headerLabel, monthRows, valuesByTypeMonth) {
        const container = document.getElementById(containerId);
        const table = document.createElement("table");
        table.className = "year-table";

        const headerCols = mediaTypes.map(t => `<th>${labels[t]}</th>`).join("");
        const bodyRows = monthRows.map((m, idx) => {
            const cols = mediaTypes.map(t => `<td>${valuesByTypeMonth[t][idx]}</td>`).join("");
            return `<tr><td>${m}</td>${cols}</tr>`;
        }).join("");

        table.innerHTML = `
            <thead><tr><th>${headerLabel}</th>${headerCols}</tr></thead>
            <tbody>${bodyRows}</tbody>
        `;

        const wrap = document.createElement("div");
        wrap.className = "year-table-wrap";
        wrap.append(table);
        container.innerHTML = "";
        container.append(wrap);
    }

    function renderStreaks(streakRow) {
        if (!streakRow) {
            return;
        }
        const streakMap = [
            { countId: "book-count", key: "book_streak_count" },
            { countId: "manga-count", key: "manga_streak_count" },
            { countId: "anime-count", key: "anime_streak_count" },
            { countId: "tv-count", key: "tvshow_streak_count" },
            { countId: "movie-count", key: "movie_streak_count" }
        ];
        streakMap.forEach(({ countId, key }) => {
            const el = document.getElementById(countId);
            if (el) el.textContent = Number(streakRow[key] || 0);
        });
    }

    function chartWidthFor(target) {
        const w = target?.getBoundingClientRect?.().width ?? 0;
        if (w > 40) return Math.floor(w);
        const app = document.getElementById("app-container");
        const aw = app?.getBoundingClientRect?.().width ?? 0;
        if (aw > 40) return Math.max(260, Math.floor(aw - 32));
        return Math.max(260, Math.min(560, Math.floor(window.innerWidth - 32)));
    }

    function conicGradientFromTotals(totalsByType) {
        const segments = mediaTypes
            .map(type => ({
                type,
                label: labels[type],
                color: colors[type],
                value: Math.max(0, Number(totalsByType[type] || 0))
            }))
            .filter(s => s.value > 0);
        const total = segments.reduce((sum, s) => sum + s.value, 0);
        if (total <= 0) return null;
        let pct = 0;
        const stops = segments.map(s => {
            const start = pct;
            pct += (s.value / total) * 100;
            return `${s.color} ${start.toFixed(3)}% ${pct.toFixed(3)}%`;
        });
        return { gradient: `conic-gradient(from -90deg, ${stops.join(", ")})`, segments, total };
    }

    function renderPiePair(totalsCompleted, totalsUnits) {
        const completedWheel = document.getElementById("pie-completed-wheel");
        const completedLegend = document.getElementById("pie-completed-legend");
        const unitsWheel = document.getElementById("pie-units-wheel");
        const unitsLegend = document.getElementById("pie-units-legend");

        const completedPie = conicGradientFromTotals(totalsCompleted);
        if (!completedPie) {
            completedWheel.style.background = "var(--surface-3)";
            completedLegend.innerHTML = `<li class="pie-empty">No media completed this year yet.</li>`;
        } else {
            completedWheel.style.background = completedPie.gradient;
            completedLegend.innerHTML = completedPie.segments.map(s => `
                <li>
                    <span class="pie-legend__left">
                        <span class="pie-legend__swatch" style="background:${s.color}"></span>
                        <span class="pie-legend__name">${s.label}</span>
                    </span>
                    <span>${s.value} (${((s.value / completedPie.total) * 100).toFixed(0)}%)</span>
                </li>
            `).join("");
        }

        const unitsPie = conicGradientFromTotals(totalsUnits);
        if (!unitsPie) {
            unitsWheel.style.background = "var(--surface-3)";
            unitsLegend.innerHTML = `<li class="pie-empty">No units logged this year yet.</li>`;
        } else {
            unitsWheel.style.background = unitsPie.gradient;
            unitsLegend.innerHTML = unitsPie.segments.map(s => `
                <li>
                    <span class="pie-legend__left">
                        <span class="pie-legend__swatch" style="background:${s.color}"></span>
                        <span class="pie-legend__name">${s.label}</span>
                    </span>
                    <span>${s.value.toLocaleString()} (${((s.value / unitsPie.total) * 100).toFixed(0)}%)</span>
                </li>
            `).join("");
        }
    }

    function daysInMonth(targetYear, monthIndex) {
        return new Date(targetYear, monthIndex + 1, 0).getDate();
    }

    function renderScopeLabels() {
        if (viewState.period === "year") {
            scopePieLabelEl.textContent = "Current Year";
            scopeGlanceLabelEl.textContent = "Year At A Glance";
            unitsTableHeadingEl.textContent = "Units Per Month";
            completedTableHeadingEl.textContent = "Completed Per Month";
            unitsChartLabelEl.textContent = "Units Per Month";
            completedChartLabelEl.textContent = "Completed Per Month";
            return;
        }
        const monthName = months[viewState.monthIndex];
        scopePieLabelEl.textContent = `${monthName} ${year}`;
        scopeGlanceLabelEl.textContent = `${monthName} At A Glance`;
        unitsTableHeadingEl.textContent = "Units Per Day";
        unitsChartLabelEl.textContent = "Units Per Day";
    }

    function makeLineChart(targetId, rows, tickFormat) {
        const target = document.getElementById(targetId);
        const width = chartWidthFor(target);
        const narrow = width < 520;
        const data = rows;
        const xDomain = [data[0]?.xDate, data[data.length - 1]?.xDate].filter(Boolean);
        const chart = Plot.plot({
            background: "transparent",
            width,
            height: narrow ? 340 : 310,
            marginLeft: 44,
            marginRight: narrow ? 10 : Math.min(100, Math.floor(width * 0.22)),
            marginBottom: narrow ? 78 : 34,
            x: {
                type: "utc",
                tickFormat,
                label: null,
                domain: xDomain.length === 2 ? xDomain : undefined
            },
            y: { label: null, grid: true },
            color: {
                legend: true,
                domain: mediaTypes.map(t => legendLabels[t]),
                range: mediaTypes.map(t => colors[t])
            },
            marks: [
                Plot.lineY(data, {
                    x: "xDate",
                    y: "value",
                    stroke: "mediaTypeLegendLabel",
                    curve: "monotone-x"
                }),
                Plot.dot(data, {
                    x: "xDate",
                    y: "value",
                    fill: "mediaTypeLegendLabel",
                    r: 2.5
                })
            ]
        });
        target.innerHTML = "";
        target.append(chart);
    }

    function buildAggregates(completedRows, journalRows) {
        const totalsCompleted = emptyByType();
        const totalsUnits = emptyByType();
        const unitsByMonth = {};
        const completedByMonth = {};
        const unitsByDay = {};
        const completedByDay = {};

        mediaTypes.forEach(type => {
            unitsByMonth[type] = Array(12).fill(0);
            completedByMonth[type] = Array(12).fill(0);
            unitsByDay[type] = Array.from({ length: 12 }, (_, monthIndex) => Array(daysInMonth(year, monthIndex)).fill(0));
            completedByDay[type] = Array.from({ length: 12 }, (_, monthIndex) => Array(daysInMonth(year, monthIndex)).fill(0));
        });

        for (const row of completedRows) {
            const mediaType = normalizeType(row.lu_media?.media_type);
            if (!mediaType || !row.date_finished) continue;
            const d = new Date(row.date_finished);
            const monthIndex = d.getUTCMonth();
            const dayIndex = d.getUTCDate() - 1;
            totalsCompleted[mediaType] += 1;
            completedByMonth[mediaType][monthIndex] += 1;
            if (completedByDay[mediaType][monthIndex][dayIndex] !== undefined) {
                completedByDay[mediaType][monthIndex][dayIndex] += 1;
            }
        }

        for (const row of journalRows) {
            const mediaType = normalizeType(row.lu_media_status?.lu_media?.media_type);
            if (!mediaType) continue;
            const units = Number(row.units || 0);
            const d = new Date(row.date_created);
            const monthIndex = d.getUTCMonth();
            const dayIndex = d.getUTCDate() - 1;
            totalsUnits[mediaType] += units;
            unitsByMonth[mediaType][monthIndex] += units;
            if (unitsByDay[mediaType][monthIndex][dayIndex] !== undefined) {
                unitsByDay[mediaType][monthIndex][dayIndex] += units;
            }
        }

        return { totalsCompleted, totalsUnits, unitsByMonth, completedByMonth, unitsByDay, completedByDay };
    }

    function renderView(agg) {
        renderScopeLabels();

        const isMonthView = viewState.period === "month";
        if (glanceCompletedBlock) glanceCompletedBlock.hidden = isMonthView;
        if (cardCompletedTrend) cardCompletedTrend.hidden = isMonthView;
        if (isMonthView && chartCompletedEl) chartCompletedEl.innerHTML = "";

        let scopedTotalsCompleted = emptyByType();
        let scopedTotalsUnits = emptyByType();
        let avgDivisor = 1;

        if (viewState.period === "year") {
            scopedTotalsCompleted = agg.totalsCompleted;
            scopedTotalsUnits = agg.totalsUnits;
            avgDivisor = (now.getUTCFullYear() === year)
                ? Math.max(1, Math.floor((Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) - Date.UTC(year, 0, 1)) / 86400000) + 1)
                : 365;
        } else {
            const monthIndex = viewState.monthIndex;
            mediaTypes.forEach(type => {
                scopedTotalsCompleted[type] = agg.completedByMonth[type][monthIndex];
                scopedTotalsUnits[type] = agg.unitsByMonth[type][monthIndex];
            });
            if (now.getUTCFullYear() === year && now.getUTCMonth() === monthIndex) {
                avgDivisor = Math.max(1, now.getUTCDate());
            } else {
                avgDivisor = daysInMonth(year, monthIndex);
            }
        }

        renderSmallTable("year-total-completed", mediaTypes.map(type => ({
            label: labels[type],
            value: scopedTotalsCompleted[type]
        })));

        renderSmallTable("year-units-per-day", mediaTypes.map(type => ({
            label: labels[type],
            value: (scopedTotalsUnits[type] / avgDivisor).toFixed(2)
        })));

        if (viewState.period === "year") {
            renderMatrixTable("year-units-by-month", "", months, agg.unitsByMonth);
            renderMatrixTable("year-completed-by-month", "", months, agg.completedByMonth);
        } else {
            const m = viewState.monthIndex;
            const dayRows = Array.from({ length: daysInMonth(year, m) }, (_, i) => String(i + 1));
            const unitsByDaySlice = {};
            mediaTypes.forEach(type => {
                unitsByDaySlice[type] = agg.unitsByDay[type][m];
            });
            renderMatrixTable("year-units-by-month", "Day", dayRows, unitsByDaySlice);
        }

        const unitsChartRows = [];
        const completedChartRows = [];
        if (viewState.period === "year") {
            months.forEach((_, monthIndex) => {
                mediaTypes.forEach(type => {
                    unitsChartRows.push({
                        xDate: new Date(Date.UTC(year, monthIndex, 1)),
                        mediaTypeLegendLabel: legendLabels[type],
                        value: agg.unitsByMonth[type][monthIndex]
                    });
                    completedChartRows.push({
                        xDate: new Date(Date.UTC(year, monthIndex, 1)),
                        mediaTypeLegendLabel: legendLabels[type],
                        value: agg.completedByMonth[type][monthIndex]
                    });
                });
            });
            renderPiePair(scopedTotalsCompleted, scopedTotalsUnits);
            requestAnimationFrame(() => {
                makeLineChart("chart-units", unitsChartRows, "%b");
                makeLineChart("chart-completed", completedChartRows, "%b");
            });
            return;
        }

        const selectedMonth = viewState.monthIndex;
        const totalDays = daysInMonth(year, selectedMonth);
        for (let day = 1; day <= totalDays; day += 1) {
            mediaTypes.forEach(type => {
                unitsChartRows.push({
                    xDate: new Date(Date.UTC(year, selectedMonth, day)),
                    mediaTypeLegendLabel: legendLabels[type],
                    value: agg.unitsByDay[type][selectedMonth][day - 1]
                });
            });
        }
        renderPiePair(scopedTotalsCompleted, scopedTotalsUnits);
        requestAnimationFrame(() => {
            makeLineChart("chart-units", unitsChartRows, "%-d");
        });
    }

    function setupViewControls(agg) {
        monthSelectEl.innerHTML = months
            .map((name, index) => `<option value="${index}" ${index === currentMonthIndex ? "selected" : ""}>${name}</option>`)
            .join("");

        function syncControls() {
            const monthMode = viewState.period === "month";
            periodYearBtn.classList.toggle("active", !monthMode);
            periodMonthBtn.classList.toggle("active", monthMode);
            monthSelectEl.hidden = !monthMode;
        }

        periodYearBtn.addEventListener("click", () => {
            viewState.period = "year";
            syncControls();
            renderView(agg);
        });

        periodMonthBtn.addEventListener("click", () => {
            viewState.period = "month";
            syncControls();
            renderView(agg);
        });

        monthSelectEl.addEventListener("change", (event) => {
            viewState.monthIndex = Number(event.target.value || 0);
            renderView(agg);
        });

        syncControls();
    }

    async function loadTrends() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            statusEl.textContent = "Please log in to view trends.";
            return;
        }

        const [streakRes, completedRes, journalRes] = await Promise.all([
            supabase.from("lu_user_streak").select("*").eq("user_id", user.id).maybeSingle(),
            supabase
                .from("lu_media_status")
                .select("media_id,date_finished,status,lu_media(media_type)")
                .eq("user_id", user.id)
                .eq("status", "completed")
                .gte("date_finished", startIso)
                .lt("date_finished", endIso),
            supabase
                .from("lu_journal_entry")
                .select("units,date_created,lu_media_status!inner(user_id,media_id,lu_media!inner(media_type))")
                .eq("lu_media_status.user_id", user.id)
                .gte("date_created", startIso)
                .lt("date_created", endIso)
        ]);

        if (streakRes.error || completedRes.error || journalRes.error) {
            statusEl.textContent = "Could not load trends right now.";
            return;
        }

        renderStreaks(streakRes.data);

        const completedRows = completedRes.data || [];
        const journalRows = journalRes.data || [];
        const agg = buildAggregates(completedRows, journalRows);

        statusEl.style.display = "none";
        viewControlsEl.style.display = "flex";
        trendsGrid.style.display = "grid";
        setupViewControls(agg);
        renderView(agg);
    }

    loadTrends();
</script>
</body>
</html>
