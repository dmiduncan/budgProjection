<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Trends</title>
    <link rel="stylesheet" href="../../css/main.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm"></script>
    <style>
        #app-container {
            display: block;
            padding: 2em 15%;
        }

        @media (max-width: 900px) {
            #app-container { padding: 1.5em 4%; }
        }

        .trends-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5em;
            margin-top: 1.5em;
        }

        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5em;
            position: relative;
            overflow: hidden;
        }

        .chart-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent);
        }

        .chart-card__label {
            font-family: var(--font-display);
            font-size: 0.68em;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 1.25em;
        }

        .chart-card__plot {
            width: 100%;
            overflow-x: auto;
        }

        /* Override Observable Plot defaults to match dark theme */
        .chart-card__plot svg {
            background: transparent !important;
            color: var(--text-muted);
            overflow: visible;
        }

        .chart-card__plot [aria-label="x-axis tick label"],
        .chart-card__plot [aria-label="y-axis tick label"] {
            fill: var(--text-faint) !important;
            font-family: var(--font-body) !important;
            font-size: 11px !important;
        }

        .chart-card__plot [aria-label="x-axis"],
        .chart-card__plot [aria-label="y-axis"] {
            stroke: var(--border) !important;
        }

        .chart-card__plot [aria-label="x-grid"],
        .chart-card__plot [aria-label="y-grid"] {
            stroke: rgba(255,255,255,0.04) !important;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <div class="toolbar__inner">
            <div class="toolbar__brand">
                <span class="toolbar__logo">shelf<span style="color:var(--accent)">STACK</span></span>
            </div>
            <nav class="toolbar__nav">
                <button type="button" class="toolbar__btn" title="Home" onclick="window.location.href='../'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="18" viewBox="0 0 20 18"
                         fill="none" stroke="currentColor" stroke-width="1.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2.5"  y="3" width="3"   height="12" rx="0.3"/>
                        <rect x="7"    y="8" width="3"   height="7"  rx="0.3"/>
                        <rect x="11.5" y="5" width="3"   height="10" rx="0.3"/>
                        <g transform="rotate(-15, 18.5, 15)">
                            <rect x="16" y="7" width="2.5" height="8" rx="0.3"/>
                        </g>
                    </svg>
                </button>
                <button type="button" class="toolbar__btn" title="Home" onclick="window.location.href='/'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
                        <path d="M9 21V12h6v9"/>
                    </svg>
                </button>
            </nav>
        </div>
    </div>

    <div id="app-container">

        <div class="trends-grid">

            <div class="chart-card" style="grid-column: 1 / -1;">
                <div class="chart-card__label">Progress Logged — Units per Week</div>
                <div class="chart-card__plot" id="chart-progress"></div>
            </div>

            <div class="chart-card">
                <div class="chart-card__label">Media Type Breakdown</div>
                <div class="chart-card__plot" id="chart-types"></div>
            </div>

            <div class="chart-card">
                <div class="chart-card__label">Completion Rate</div>
                <div class="chart-card__plot" id="chart-completion"></div>
            </div>

        </div>
    </div>

    <script type="module">
        import * as Plot from "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm";

        const ACCENT      = "#7c5cfc";
        const ACCENT_TEXT = "#a78bfa";
        const TEXT_FAINT  = "rgba(240,237,232,0.25)";
        const TEXT_MUTED  = "rgba(240,237,232,0.5)";
        const BORDER      = "rgba(255,255,255,0.07)";

        // ── Shared plot defaults ──────────────────────────────
        const baseStyle = {
            background: "transparent",
            color: TEXT_MUTED,
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 11,
        };

        const axisOpts = {
            stroke: BORDER,
            tickStroke: "transparent",
            labelFill: TEXT_FAINT,
            labelFontSize: 11,
        };

        // ── Demo data ─────────────────────────────────────────

        // 1. Progress logged per week (last 12 weeks)
        const progressData = Array.from({ length: 12 }, (_, i) => {
            const d = new Date();
            d.setDate(d.getDate() - (11 - i) * 7);
            return {
                week: new Date(d.getFullYear(), d.getMonth(), d.getDate()),
                units: Math.floor(20 + Math.random() * 120),
            };
        });

        // 2. Media type counts
        const typeData = [
            { type: "Books",  count: 12 },
            { type: "Manga",  count: 31 },
            { type: "Anime",  count: 8  },
            { type: "TV",     count: 5  },
            { type: "Movies", count: 19 },
        ];

        const typeColors = {
            Books:  "#f5c842",
            Manga:  "#7aaee8",
            Anime:  "#c084fc",
            TV:     "#22d3ee",
            Movies: "#a0a0a0",
        };

        // 3. Completion status
        const completionData = [
            { status: "Completed", count: 47 },
            { status: "In Progress", count: 12 },
            { status: "DNF",        count: 4  },
        ];

        const completionColors = {
            "Completed":   "#4ade80",
            "In Progress": ACCENT_TEXT,
            "DNF":         "#f87171",
        };

        // ── Chart 1: Progress over time ───────────────────────
        const chartProgress = Plot.plot({
            ...baseStyle,
            width: document.getElementById("chart-progress").offsetWidth || 600,
            height: 200,
            marginLeft: 40,
            marginBottom: 36,
            x: { type: "utc", label: null, tickFormat: "%b %d", ...axisOpts },
            y: { label: "Units", grid: true, ...axisOpts },
            marks: [
                Plot.areaY(progressData, {
                    x: "week",
                    y: "units",
                    fill: ACCENT,
                    fillOpacity: 0.12,
                    curve: "monotone-x",
                }),
                Plot.lineY(progressData, {
                    x: "week",
                    y: "units",
                    stroke: ACCENT,
                    strokeWidth: 2,
                    curve: "monotone-x",
                }),
                Plot.dotY(progressData, {
                    x: "week",
                    y: "units",
                    fill: ACCENT,
                    r: 3,
                }),
            ],
        });

        document.getElementById("chart-progress").append(chartProgress);

        // ── Chart 2: Type breakdown (horizontal bar) ──────────
        const chartTypes = Plot.plot({
            ...baseStyle,
            width: document.getElementById("chart-types").offsetWidth || 300,
            height: 200,
            marginLeft: 64,
            marginBottom: 24,
            x: { label: null, grid: true, ...axisOpts },
            y: { label: null, ...axisOpts },
            marks: [
                Plot.barX(typeData, {
                    x: "count",
                    y: "type",
                    fill: d => typeColors[d.type],
                    fillOpacity: 0.85,
                    rx: 2,
                    sort: { y: "-x" },
                }),
                Plot.text(typeData, {
                    x: "count",
                    y: "type",
                    text: d => d.count,
                    dx: 6,
                    fill: TEXT_MUTED,
                    fontSize: 11,
                    textAnchor: "start",
                    sort: { y: "-x" },
                }),
            ],
        });

        document.getElementById("chart-types").append(chartTypes);

        // ── Chart 3: Completion rate (bar) ────────────────────
        const chartCompletion = Plot.plot({
            ...baseStyle,
            width: document.getElementById("chart-completion").offsetWidth || 300,
            height: 200,
            marginLeft: 80,
            marginBottom: 24,
            x: { label: null, grid: true, ...axisOpts },
            y: { label: null, ...axisOpts },
            marks: [
                Plot.barX(completionData, {
                    x: "count",
                    y: "status",
                    fill: d => completionColors[d.status],
                    fillOpacity: 0.85,
                    rx: 2,
                }),
                Plot.text(completionData, {
                    x: "count",
                    y: "status",
                    text: d => d.count,
                    dx: 6,
                    fill: TEXT_MUTED,
                    fontSize: 11,
                    textAnchor: "start",
                }),
            ],
        });

        document.getElementById("chart-completion").append(chartCompletion);
    </script>

</body>
</html>
