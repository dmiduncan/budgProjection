<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Budget Managment</title>
    <link rel="stylesheet" href="./css/main.css">
    <script type="module" src="./auth.js"></script>
    <style>
        ul {
            list-style-type: none;
        }

        /* Remove white outline from buttons and add hover effect */
        button,
        .button {
            box-shadow: none !important;
            background-color: transparent !important;
            transition: background-color 0.2s ease-in-out;
        }

        button:hover,
        .button:hover {
            box-shadow: none !important;
            background-color: rgba(255, 255, 255, 0.05) !important;
        }
    </style>
</head>
<body>
    <div id="app-container" style="display:none;">
        <h3>Budget Projection</h3>
        <label>Starting Balance:</label>
        <input type="number" id="balanceInput" name="balanceInput" style="text-align: right;" value="0">
        <button id="recalcButton">Calculate</button>
        <br>
        <h3>Transactions</h3>
        <div id="txBucket">
            <ul id="txList" class=""></ul>
        </div>
    </div>
</body>
</html>
